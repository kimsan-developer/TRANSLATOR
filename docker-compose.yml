services:
  mongodb:
    image: mongo:7.0
    container_name: video_translator_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: video_translator_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/videotranslator
      - JWT_SECRET=production_jwt_secret_key_change_in_prod
      - JWT_REFRESH_SECRET=production_jwt_refresh_secret_key
      - CORS_ORIGIN=http://localhost:5173
      - STORAGE_DIR=/app/uploads
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: video_translator_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  media_uploads:
